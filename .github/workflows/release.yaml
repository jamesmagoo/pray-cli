# Runs GoReleaser whenever you push a tag like v0.1.0.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload binaries

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A personal access token with write access to homebrew-tap and
          # scoop-bucket. The built-in GITHUB_TOKEN can't push to other repos.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}