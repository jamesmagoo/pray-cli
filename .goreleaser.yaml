# .deb / .rpm / .apk files attached to each GitHub release
nfpms:
  - package_name: pray
    homepage: https://github.com/jamesmagoo/pray-cli
    maintainer: James McGauran <jamesmcgauran11@gmail.com>
    description: Prayers in your terminal
    license: Unlicense
    formats: [deb, rpm, apk]
    # `pray copy` needs one of these on Linux
    suggests: [xclip, xsel, wl-clipboard]